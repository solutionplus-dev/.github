name: Security self-check

# Quick PolinRider / Shai-Hulud indicator scan of the working tree
# (security/selfcheck.mjs --ci --no-history, shallow checkout).
# To keep Actions minutes low it runs only on pushes to main and on
# pull requests into them, never on a schedule; a newer run for the same
# branch or PR cancels the older one. The full history scan runs locally:
# node security/selfcheck.mjs   Red = do not merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run self-check (working tree only)
        run: node security/selfcheck.mjs --ci --no-history
