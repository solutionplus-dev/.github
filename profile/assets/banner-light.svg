<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="SolutionPlus — German-led software development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fbfaf9"/>
      <stop offset="1" stop-color="#f4f2f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7043" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff7043" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#141618" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="rounded"><rect width="1600" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1600" height="420" fill="url(#bg)"/>
    <rect width="1600" height="420" fill="url(#dots)"/>
    <circle cx="1330" cy="210" r="250" fill="url(#glow)"/>

    <!-- modular "plus" motif: structure assembled from parts -->
    <g transform="translate(1330,210)">
      <g fill="none" stroke="#141618" stroke-opacity="0.14" stroke-width="1.5">
        <rect x="-114" y="-114" width="64" height="64" rx="18"/>
        <rect x="50" y="-114" width="64" height="64" rx="18"/>
        <rect x="-114" y="50" width="64" height="64" rx="18"/>
        <rect x="50" y="50" width="64" height="64" rx="18"/>
      </g>
      <g fill="#ffffff" fill-opacity="0.9" stroke="#141618" stroke-opacity="0.20" stroke-width="1.5">
        <rect x="-32" y="-114" width="64" height="64" rx="18"/>
        <rect x="-114" y="-32" width="64" height="64" rx="18"/>
        <rect x="50" y="-32" width="64" height="64" rx="18"/>
        <rect x="-32" y="50" width="64" height="64" rx="18"/>
      </g>
      <rect x="-32" y="-32" width="64" height="64" rx="18" fill="#ff7043"/>
      <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
        <line x1="-16" y1="0" x2="16" y2="0"/>
        <line x1="0" y1="-16" x2="0" y2="16"/>
      </g>
    </g>

    <!-- monogram -->
    <rect x="96" y="70" width="60" height="60" rx="18" fill="#ff7043"/>
    <text x="126" y="111" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#ffffff" text-anchor="middle">S+</text>

    <!-- eyebrow pill -->
    <rect x="180" y="82" width="278" height="36" rx="18" fill="#ff7043" fill-opacity="0.14" stroke="#ff7043" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="202" y="106" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2.1" fill="#9c3b18">FROM IDEA TO DELIVERY</text>

    <!-- wordmark -->
    <text x="96" y="248" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="86" font-weight="700" letter-spacing="-3" fill="#141618">SolutionPlus<tspan fill="#ff7043">.</tspan></text>

    <!-- subtitle -->
    <text x="96" y="300" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="29" font-weight="500" letter-spacing="-0.3" fill="#4b535b">German-led software development — MVPs, teams, modernization</text>

    <rect x="96" y="330" width="118" height="4" rx="2" fill="#ff7043"/>

    <!-- meta -->
    <text x="96" y="378" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="0.2" fill="#6b737b">Berlin + Pakistan  ·  Germany &amp; US clients  ·  ISO-aligned delivery</text>
  </g>

  <rect x="0.75" y="0.75" width="1598.5" height="418.5" rx="28" fill="none" stroke="#141618" stroke-opacity="0.15" stroke-width="1.5"/>
</svg>
